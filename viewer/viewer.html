<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screenshot Preview - WebShot</title>
  <link rel="icon" type="image/png" href="../icons/icon32.png">
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <div class="viewer-layout">
    <!-- Top Bar -->
    <header class="toolbar">
      <div class="toolbar-left">
        <div class="brand">
          <img src="../icons/icon32.png" alt="Logo" class="brand-icon">
          <span class="brand-title">WebShot</span>
        </div>
        <div class="meta-divider"></div>
        <div class="file-meta">
          <span id="meta-filename" class="meta-filename">Loading...</span>
          <span id="meta-dimensions" class="meta-tag"></span>
          <span id="meta-size" class="meta-tag"></span>
        </div>
      </div>

      <div class="toolbar-center">
        <div class="zoom-controls">
          <button id="btn-zoom-out" class="tool-btn" title="Zoom Out (-)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
              <line x1="8" y1="11" x2="14" y2="11"/>
            </svg>
          </button>
          <span id="zoom-level" class="zoom-display">100%</span>
          <button id="btn-zoom-in" class="tool-btn" title="Zoom In (+)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
              <line x1="11" y1="8" x2="11" y2="14"/>
              <line x1="8" y1="11" x2="14" y2="11"/>
            </svg>
          </button>
          <button id="btn-zoom-fit" class="tool-btn-pill active" title="Fit to Screen (0)">Fit</button>
          <button id="btn-zoom-100" class="tool-btn-pill" title="Original 100% (1)">100%</button>
        </div>
      </div>

      <div class="toolbar-right">
        <button id="btn-copy" class="action-btn secondary" title="Copy to clipboard (Cmd+C / Ctrl+C)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          <span id="copy-btn-text">Copy</span>
        </button>

        <button id="btn-download-jpg" class="action-btn secondary" title="Download as JPEG">
          <span>JPEG</span>
        </button>

        <button id="btn-download-png" class="action-btn primary" title="Download as PNG (Cmd+S / Ctrl+S)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <span>Download PNG</span>
        </button>
      </div>
    </header>

    <!-- Main Image Canvas Container -->
    <main class="canvas-viewport" id="viewport">
      <div class="image-wrapper" id="image-wrapper">
        <img id="preview-image" alt="Captured Screenshot" class="preview-img">
      </div>
    </main>
  </div>

  <script src="viewer.js"></script>
</body>
</html>
